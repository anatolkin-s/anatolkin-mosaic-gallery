<div class="mosaic-gallery is-layout-pending"
     style="--gap:{gap}px; --radius:{design.borderRadius}px;
            --bg:{design.backgroundColor};
            --frame-color:{design.frameColor};
            --frame-accent:{design.frameAccentColor};
            --frame-width:{design.frameWidth}px;
            --frame-band-key:{frameBands.key}px;
            --frame-band-quarter:{frameBands.quarter}px;
            --frame-band-third:{frameBands.third}px;
            --frame-band-forty:{frameBands.forty}px;
            --frame-band-forty-five:{frameBands.fortyFive}px;
            --frame-band-sixty:{frameBands.sixty}px;
            --frame-band-two-thirds:{frameBands.twoThirds}px;
            --frame-band-three-quarters:{frameBands.threeQuarters}px;
            --frame-band-total:{frameBands.total}px;
            --caption-align:{captionAlign};
            --caption-color:{design.captionColor};"
     data-apply-bg="{design.applyTo}"
     data-frame-style="{design.frameStyle}"
     data-load-more-frame="{f:if(condition: settings.loadMoreUseFrameStyle, then: 1, else: 0)}"
     data-shadow="{f:if(condition: design.shadow, then: 1, else: 0)}"
     data-lightbox="{f:if(condition: settings.enableLightbox, then: 1, else: 0)}"
     data-group="{galleryGroup}"
     data-initial="{itemsPerPage}"
     data-step="{loadStep}"
     data-layout-mode="{layoutMode}"
     data-max-items-per-row="{maxItemsPerRow}"
     data-lb-overlay="{design.lightbox.overlay}"
     data-lb-overlay-alpha="{design.lightbox.overlayAlpha}"
     data-lb-nav="{design.lightbox.navColor}"
     data-lb-close="{design.lightbox.closeColor}"
     data-lb-caption="{design.lightbox.captionColor}"
     data-lb-caption-bg="{design.lightbox.captionBackground}"
     data-lb-caption-bg-alpha="{design.lightbox.captionBackgroundAlpha}"
     data-lb-caption-align="{design.lightbox.captionAlign}"
     data-lb-caption-size="{design.lightbox.captionSize}"
     data-lb-caption-style="{design.lightbox.captionStyle}">
  <div class="mosaic-grid">
    <div class="mosaic-sizer"></div>

    <f:for each="{items}" as="it">
      <f:variable name="previewUrl" value="{f:uri.image(image: it.file, maxWidth: maxWidth)}" />
      <figure class="mosaic-item {f:if(condition: it.hidden, then: 'is-hidden')}" data-layout-span="{it.layoutSpan}" data-pattern-weight="{it.patternWeight}" data-aspect-ratio="{it.aspectRatio}">
        <a href="{it.file.publicUrl}"
           class="{f:if(condition: settings.enableLightbox, then: 'glightbox', else: '')}"
           data-gallery="{galleryGroup}"
           data-title="{it.caption}"
           target="{f:if(condition: settings.enableLightbox, then: '_self', else: '_blank')}">
          <img src="{f:if(condition: it.hidden, then: 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=', else: previewUrl)}"
               data-src="{f:if(condition: it.hidden, then: previewUrl)}"
               alt="{it.alt}" title="{it.caption}"
               loading="{f:if(condition: it.hidden, then: 'lazy', else: 'eager')}" />
        </a>
        <f:if condition="{showCaptions}">
          <f:if condition="{it.caption}">
            <figcaption>{it.caption}</figcaption>
          </f:if>
        </f:if>
      </figure>
    </f:for>
  </div>

    <f:if condition="{hasMore}">
    <div class="mosaic-actions">
      <button type="button" class="mosaic-load-more" aria-label="{f:translate(key: 'LLL:EXT:anatolkin_mosaic_gallery/Resources/Private/Language/locallang.xlf:gallery.loadMore.ariaLabel')}"><f:translate key="LLL:EXT:anatolkin_mosaic_gallery/Resources/Private/Language/locallang.xlf:gallery.loadMore" /></button>
    </div>
  </f:if>
</div>
<noscript>
  <style>
    .mosaic-gallery.is-layout-pending .mosaic-grid,
    .mosaic-gallery.is-layout-pending .mosaic-actions { visibility: visible; }
  </style>
</noscript>

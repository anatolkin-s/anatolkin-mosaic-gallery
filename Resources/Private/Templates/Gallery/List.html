<div class="mosaic-gallery is-layout-pending"
     style="--gap:{gap}px; --radius:{borderRadius}px;
            --bg:{settings.backgroundColor};
            --frame-color:{settings.frameColor};
            --frame-width:{settings.frameWidth}px;
            --frame-style:{settings.frameStyle};"
     data-apply-bg="{settings.applyTo}"
     data-shadow="{f:if(condition: settings.shadow, then: 1, else: 0)}"
     data-lightbox="{f:if(condition: settings.enableLightbox, then: 1, else: 0)}"
     data-group="{galleryGroup}"
     data-initial="{itemsPerPage}"
     data-step="{loadStep}"
     data-lb-overlay="{settings.lbOverlay}"
     data-lb-overlay-alpha="{settings.lbOverlayAlpha}"
     data-lb-nav="{settings.lbNavColor}"
     data-lb-close="{settings.lbCloseColor}"
     data-lb-caption="{settings.lbCaptionColor}"
     data-lb-caption-bg="{settings.lbCaptionBg}">
  <div class="mosaic-grid">
    <div class="mosaic-sizer"></div>

    <f:for each="{items}" as="it">
      <f:variable name="previewUrl" value="{f:uri.image(image: it.file, maxWidth: maxWidth)}" />
      <figure class="mosaic-item {f:if(condition: it.hidden, then: 'is-hidden')}">
        <a href="{it.file.publicUrl}"
           class="{f:if(condition: settings.enableLightbox, then: 'glightbox', else: '')}"
           data-gallery="{galleryGroup}"
           data-title="{it.caption}"
           target="{f:if(condition: settings.enableLightbox, then: '_self', else: '_blank')}">
          <img src="{f:if(condition: it.hidden, then: 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=', else: previewUrl)}"
               data-src="{f:if(condition: it.hidden, then: previewUrl)}"
               alt="{it.alt}" title="{it.caption}"
               loading="{f:if(condition: it.hidden, then: 'lazy', else: 'eager')}" />
        </a>
        <f:if condition="{showCaptions}">
          <f:if condition="{it.caption}">
            <figcaption>{it.caption}</figcaption>
          </f:if>
        </f:if>
      </figure>
    </f:for>
  </div>

    <f:if condition="{hasMore}">
    <div class="mosaic-actions">
      <button type="button" class="mosaic-load-more" aria-label="{f:translate(key: 'LLL:EXT:anatolkin_mosaic_gallery/Resources/Private/Language/locallang.xlf:gallery.loadMore.ariaLabel')}"><f:translate key="LLL:EXT:anatolkin_mosaic_gallery/Resources/Private/Language/locallang.xlf:gallery.loadMore" /></button>
    </div>
  </f:if>
</div>
<noscript>
  <style>
    .mosaic-gallery.is-layout-pending .mosaic-grid,
    .mosaic-gallery.is-layout-pending .mosaic-actions { visibility: visible; }
  </style>
</noscript>
